<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invers Fungsi · Presentasi Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,700;1,9..144,900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  MathJax = {
    tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']], processEscapes: true },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
    svg: { fontCache: 'global' },
    startup: { typeset: false }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0e1a;
  --bg-2: #131825;
  --card: #1a2030;
  --card-2: #232a3d;
  --border: rgba(251, 191, 36, 0.15);
  --border-soft: rgba(245, 241, 232, 0.08);
  --fg: #f5f1e8;
  --fg-soft: #d4ceb8;
  --muted: #8b92a8;
  --accent: #fbbf24;
  --accent-2: #f59e0b;
  --accent-glow: rgba(251, 191, 36, 0.35);
  --teal: #2dd4bf;
  --teal-glow: rgba(45, 212, 191, 0.25);
  --coral: #f87171;
  --green: #4ade80;
  --red: #f87171;
}

html, body { height: 100%; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

/* Background atmosphere */
.bg-atmosphere { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.bg-atmosphere::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 12% 18%, rgba(251, 191, 36, 0.10), transparent 45%),
    radial-gradient(circle at 88% 82%, rgba(45, 212, 191, 0.07), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(248, 113, 113, 0.05), transparent 50%);
}
.bg-atmosphere::after {
  content: ''; position: absolute; inset: 0;
  background-image: 
    linear-gradient(rgba(251, 191, 36, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(251, 191, 36, 0.025) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse 80% 60% at center, black 30%, transparent 90%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at center, black 30%, transparent 90%);
}

/* Floating math symbols */
.math-particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.math-particles span {
  position: absolute; font-family: 'Fraunces', serif; font-style: italic;
  color: rgba(251, 191, 36, 0.06); font-weight: 300; user-select: none;
  animation: drift linear infinite;
}
@keyframes drift {
  from { transform: translateY(110vh) translateX(0) rotate(0deg); }
  to { transform: translateY(-20vh) translateX(40px) rotate(360deg); }
}

/* Deck */
.deck { position: relative; z-index: 2; height: 100vh; width: 100vw; }

.slide {
  position: absolute; inset: 0; padding: 3.5rem 5rem 5.5rem;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none; transform: translateX(30px);
  transition: opacity 0.6s cubic-bezier(.4,.2,.2,1), transform 0.6s cubic-bezier(.4,.2,.2,1);
  overflow-y: auto; overflow-x: hidden;
}
.slide.active { opacity: 1; pointer-events: auto; transform: translateX(0); }
.slide::-webkit-scrollbar { width: 6px; }
.slide::-webkit-scrollbar-track { background: transparent; }
.slide::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Navigation */
.nav-bar { position: fixed; bottom: 1.75rem; right: 2rem; z-index: 100; display: flex; gap: 0.5rem; align-items: center; }
.nav-btn {
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(26, 32, 48, 0.85); backdrop-filter: blur(10px);
  border: 1px solid var(--border); color: var(--fg); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease; font-size: 1.1rem; font-family: 'JetBrains Mono', monospace;
}
.nav-btn:hover:not(:disabled) {
  background: var(--accent); color: var(--bg); transform: translateY(-2px);
  box-shadow: 0 10px 30px var(--accent-glow); border-color: var(--accent);
}
.nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

.indicator {
  position: fixed; bottom: 2rem; left: 2rem; z-index: 100;
  font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--muted);
  padding: 0.6rem 1.1rem; background: rgba(26, 32, 48, 0.85); backdrop-filter: blur(10px);
  border: 1px solid var(--border); border-radius: 999px; letter-spacing: 0.05em;
}
.indicator .current { color: var(--accent); font-weight: 700; }

.progress {
  position: fixed; top: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--teal));
  z-index: 100; transition: width 0.6s cubic-bezier(.4,.2,.2,1);
  box-shadow: 0 0 12px var(--accent-glow);
}

/* Typography */
.eyebrow {
  font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
  letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.75rem;
}
.eyebrow::before { content: ''; width: 32px; height: 1px; background: var(--accent); }

h1, h2, h3, h4 { font-family: 'Fraunces', serif; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; color: var(--fg); }
h1 { font-size: clamp(3rem, 7vw, 5.5rem); }
h2 { font-size: clamp(2rem, 4.5vw, 3.5rem); }
h3 { font-size: clamp(1.4rem, 2.5vw, 1.9rem); }
p { line-height: 1.6; color: var(--fg-soft); }
.lead { font-size: 1.15rem; color: var(--fg-soft); max-width: 70ch; line-height: 1.65; }

/* Cover */
.cover { justify-content: center; }
.cover-hero {
  display: grid; grid-template-columns: 1.3fr 1fr; gap: 4rem;
  align-items: center; max-width: 1400px; margin: 0 auto; width: 100%;
}
.cover-title { font-size: clamp(3.5rem, 8vw, 7rem); font-weight: 900; letter-spacing: -0.04em; line-height: 0.95; margin-bottom: 1.5rem; }
.cover-title em { font-style: italic; font-weight: 400; color: var(--accent); display: block; }
.cover-subtitle { font-size: 1.15rem; color: var(--fg-soft); max-width: 50ch; line-height: 1.7; margin-bottom: 2rem; }
.cover-meta { display: flex; gap: 2rem; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--muted); margin-top: 2rem; }
.cover-meta span { display: flex; align-items: center; gap: 0.5rem; }
.cover-meta span::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.cover-visual { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
.formula-display {
  font-family: 'Fraunces', serif; font-style: italic;
  font-size: clamp(4rem, 12vw, 9rem); font-weight: 300; color: var(--accent);
  text-shadow: 0 0 60px var(--accent-glow); position: relative; z-index: 2;
}
.formula-display .sup { font-size: 0.4em; vertical-align: super; font-weight: 400; }
.cover-visual::before { content: ''; position: absolute; inset: 0; border: 1px solid var(--border); border-radius: 50%; animation: spin 30s linear infinite; }
.cover-visual::after { content: ''; position: absolute; inset: 15%; border: 1px dashed rgba(251, 191, 36, 0.2); border-radius: 50%; animation: spin 25s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }

/* TOC */
.toc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; margin-top: 2rem; max-width: 1200px; }
.toc-item {
  display: flex; gap: 1.5rem; padding: 1.5rem;
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: 14px; transition: all 0.3s ease; cursor: pointer;
}
.toc-item:hover { border-color: var(--accent); transform: translateY(-2px); background: var(--card-2); }
.toc-num { font-family: 'Fraunces', serif; font-style: italic; font-size: 2.5rem; font-weight: 300; color: var(--accent); line-height: 1; }
.toc-text h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.05rem; font-weight: 600; margin-bottom: 0.35rem; }
.toc-text p { font-size: 0.85rem; color: var(--muted); }

/* Content slides */
.slide-header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-soft); }

.concept-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; margin-top: 1.5rem; }
.concept-card {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: 16px; padding: 1.75rem; position: relative; overflow: hidden;
  transition: all 0.3s ease;
}
.concept-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.concept-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
  background: var(--accent); transform: scaleY(0); transform-origin: top; transition: transform 0.4s ease;
}
.concept-card:hover::before { transform: scaleY(1); }
.concept-card h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.05rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--accent); }
.concept-card p { font-size: 0.92rem; line-height: 1.65; }
.concept-card .formula {
  margin-top: 1rem; padding: 0.75rem 1rem; background: var(--bg-2);
  border-radius: 8px; text-align: center; font-size: 1.05rem;
}

/* Steps */
.steps-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
.step-row {
  display: flex; gap: 1.25rem; align-items: flex-start; padding: 1.1rem 1.4rem;
  background: var(--card); border: 1px solid var(--border-soft); border-radius: 12px;
  transition: all 0.3s ease;
}
.step-row:hover { border-color: var(--accent); transform: translateX(4px); }
.step-num {
  font-family: 'Fraunces', serif; font-style: italic; font-size: 2rem; font-weight: 600;
  color: var(--accent); line-height: 1; flex-shrink: 0; min-width: 2.5rem;
}
.step-body h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; font-weight: 700; margin-bottom: 0.3rem; }
.step-body p { font-size: 0.9rem; line-height: 1.55; }

/* Properties */
.props-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem; }
.prop-card {
  background: var(--card); border: 1px solid var(--border-soft); border-radius: 12px;
  padding: 1.25rem 1.4rem; display: flex; align-items: center; gap: 1rem;
}
.prop-card .formula { font-family: 'Fraunces', serif; font-style: italic; font-size: 1.3rem; color: var(--accent); flex: 1; }
.prop-card .desc { font-size: 0.85rem; color: var(--muted); }

/* Applications */
.app-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
.app-card {
  background: var(--card); border: 1px solid var(--border-soft); border-radius: 16px;
  padding: 1.75rem; position: relative; transition: all 0.4s cubic-bezier(.4,.2,.2,1);
  overflow: hidden;
}
.app-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
.app-icon {
  width: 48px; height: 48px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem;
  color: var(--bg); font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 1.5rem;
}
.app-card h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
.app-card p { font-size: 0.9rem; color: var(--fg-soft); line-height: 1.6; }
.app-card .formula {
  margin-top: 1rem; padding: 0.75rem; background: var(--bg-2); border-radius: 8px;
  font-family: 'Fraunces', serif; font-style: italic; color: var(--teal); text-align: center; font-size: 0.95rem;
}

/* Example problems */
.example-card {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: 16px; padding: 2rem; margin-top: 1.5rem;
}
.example-badge {
  display: inline-block; padding: 0.4rem 0.9rem; background: var(--accent);
  color: var(--bg); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
  font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border-radius: 6px; margin-bottom: 1rem;
}
.example-question { font-family: 'Fraunces', serif; font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--fg); }
.solution-steps { display: flex; flex-direction: column; gap: 0.85rem; margin-top: 1rem; }
.step {
  display: flex; gap: 1rem; align-items: flex-start; padding: 0.85rem 1rem;
  background: var(--bg-2); border-radius: 10px; border-left: 3px solid var(--accent);
}
.step-num {
  font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700;
  color: var(--accent); background: rgba(251, 191, 36, 0.1);
  padding: 0.2rem 0.5rem; border-radius: 4px; flex-shrink: 0; letter-spacing: 0.05em;
}
.step-content { font-size: 0.95rem; line-height: 1.6; color: var(--fg-soft); }
.answer-box {
  margin-top: 1.5rem; padding: 1.25rem 1.5rem;
  background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(45, 212, 191, 0.05));
  border: 1px solid var(--accent); border-radius: 12px; display: flex; align-items: center; gap: 1rem;
}
.answer-label { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.answer-value { font-family: 'Fraunces', serif; font-style: italic; font-size: 1.4rem; color: var(--fg); font-weight: 600; }

/* Question slides */
.question-slide { padding: 3.5rem 4rem 5.5rem; }
.question-header { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.5rem; }
.question-num { font-family: 'Fraunces', serif; font-style: italic; font-size: 3.5rem; font-weight: 300; color: var(--accent); line-height: 1; }
.question-meta { flex: 1; }
.question-meta .label { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.25rem; }
.question-meta .topic { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--fg); }
.question-text {
  font-family: 'Fraunces', serif; font-size: 1.35rem; font-weight: 500; line-height: 1.5;
  margin-bottom: 1.5rem; color: var(--fg); padding: 1.25rem 1.5rem;
  background: var(--card); border-radius: 12px; border-left: 3px solid var(--accent);
}
.options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
.option {
  display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1.1rem;
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: 10px; cursor: pointer; transition: all 0.25s ease;
  font-size: 0.95rem; user-select: none;
}
.option:hover { border-color: var(--accent); background: var(--card-2); transform: translateX(2px); }
.option.selected { border-color: var(--accent); background: rgba(251, 191, 36, 0.08); box-shadow: 0 0 0 1px var(--accent); }
.option.correct { border-color: var(--green); background: rgba(74, 222, 128, 0.1); box-shadow: 0 0 0 1px var(--green); }
.option.wrong { border-color: var(--red); background: rgba(248, 113, 113, 0.1); box-shadow: 0 0 0 1px var(--red); }
.option.disabled { cursor: not-allowed; pointer-events: none; }
.option-letter {
  width: 28px; height: 28px; border-radius: 8px; background: var(--bg-2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.85rem;
  color: var(--muted); flex-shrink: 0; transition: all 0.25s ease;
}
.option.selected .option-letter { background: var(--accent); color: var(--bg); }
.option.correct .option-letter { background: var(--green); color: var(--bg); }
.option.wrong .option-letter { background: var(--red); color: var(--bg); }
.option-text { flex: 1; color: var(--fg-soft); font-size: 0.95rem; }
.option.correct .option-text { color: var(--green); }
.option.wrong .option-text { color: var(--red); }

.action-row { display: flex; gap: 1rem; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; }
.btn {
  padding: 0.75rem 1.5rem; border-radius: 10px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 0.9rem;
  cursor: pointer; border: 1px solid transparent; transition: all 0.25s ease;
  display: inline-flex; align-items: center; gap: 0.5rem;
}
.btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-2); transform: translateY(-2px); box-shadow: 0 8px 20px var(--accent-glow); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--fg-soft); border-color: var(--border-soft); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

.status-pill {
  padding: 0.5rem 1rem; border-radius: 999px;
  font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
  font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  display: none; align-items: center; gap: 0.5rem;
}
.status-pill.show { display: inline-flex; }
.status-pill.correct { background: rgba(74, 222, 128, 0.15); color: var(--green); border: 1px solid var(--green); }
.status-pill.wrong { background: rgba(248, 113, 113, 0.15); color: var(--red); border: 1px solid var(--red); }

.explanation {
  background: var(--bg-2); border: 1px solid var(--border-soft);
  border-radius: 12px; max-height: 0; overflow: hidden; opacity: 0;
  transition: all 0.4s ease; padding: 0 1.5rem;
}
.explanation.show { max-height: 800px; opacity: 1; padding: 1.25rem 1.5rem; }
.explanation-header {
  display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;
  font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
  font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent);
}
.explanation-body { font-size: 0.95rem; line-height: 1.7; color: var(--fg-soft); }

/* Graph SVG */
.graph-container {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: 16px; padding: 1.5rem; margin-top: 1.5rem;
}
.graph-svg { width: 100%; height: auto; display: block; }

/* Results */
.results-hero { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; flex: 1; gap: 1.5rem; }
.score-ring { position: relative; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
.score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.score-ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
.score-ring .bg-circle { stroke: var(--card); }
.score-ring .progress-circle {
  stroke: url(#scoreGradient); stroke-dasharray: 754; stroke-dashoffset: 754;
  transition: stroke-dashoffset 1.8s cubic-bezier(.4,.2,.2,1);
  filter: drop-shadow(0 0 12px var(--accent-glow));
}
.score-value { position: absolute; display: flex; flex-direction: column; align-items: center; }
.score-value .number { font-family: 'Fraunces', serif; font-size: 4.5rem; font-weight: 900; color: var(--accent); line-height: 1; }
.score-value .label { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; margin-top: 0.5rem; }

.results-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; margin-top: 1rem; width: 100%; max-width: 700px; }
.stat-card { background: var(--card); border: 1px solid var(--border-soft); border-radius: 14px; padding: 1.25rem; text-align: center; }
.stat-card .stat-value { font-family: 'Fraunces', serif; font-size: 2.4rem; font-weight: 800; line-height: 1; margin-bottom: 0.4rem; }
.stat-card .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
.stat-card.correct { border-color: rgba(74, 222, 128, 0.4); }
.stat-card.correct .stat-value { color: var(--green); }
.stat-card.wrong { border-color: rgba(248, 113, 113, 0.4); }
.stat-card.wrong .stat-value { color: var(--red); }
.stat-card.unanswered .stat-value { color: var(--muted); }

.verdict { font-family: 'Fraunces', serif; font-style: italic; font-size: 1.4rem; color: var(--fg); text-align: center; max-width: 60ch; line-height: 1.5; }

/* Conclusion */
.conclusion-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2rem; margin-top: 1.5rem; }
.key-points { display: flex; flex-direction: column; gap: 0.9rem; }
.point {
  display: flex; gap: 1rem; padding: 1.1rem 1.25rem;
  background: var(--card); border-radius: 12px;
  border: 1px solid var(--border-soft); border-left: 3px solid var(--accent);
}
.point-icon { font-family: 'Fraunces', serif; font-style: italic; font-size: 1.4rem; color: var(--accent); font-weight: 600; flex-shrink: 0; min-width: 1.5rem; }

function buildMateri1() {
  return `
    <section class="slide" data-index="2">
      <div class="slide-header">
        <div class="eyebrow">Bab 01 · Pengertian</div>
        <h2>Apa itu Invers Fungsi?</h2>
      </div>
      <p class="lead">Invers fungsi adalah kebalikan dari suatu fungsi. Jika fungsi $f$ memetakan $x$ ke $y$, maka invers $f^{-1}$ memetakan $y$ kembali ke $x$. Dengan kata lain, invers fungsi "membalik" apa yang dilakukan oleh fungsi aslinya.</p>
      <div class="concept-grid">
        <div class="concept-card">
          <h3>Definisi Formal</h3>
          <p>Jika $f: A \\to B$ adalah fungsi satu-satu (bijektif), maka inversnya $f^{-1}: B \\to A$ didefinisikan sebagai:</p>
          <div class="formula">$$f^{-1}(y) = x \\iff f(x) = y$$</div>
        </div>
        <div class="concept-card">
          <h3>Bayangan Cermin</h3>
          <p>Grafik $y = f^{-1}(x)$ adalah pencerminan dari grafik $y = f(x)$ terhadap garis $y = x$. Setiap titik $(a, b)$ pada $f$ berubah menjadi $(b, a)$ pada $f^{-1}$.</p>
          <div class="formula">$$(a, b) \\xrightarrow{\\,f^{-1}\\,} (b, a)$$</div>
        </div>
      </div>
    </section>`;
}

function buildMateri2() {
  return `
    <section class="slide" data-index="3">
      <div class="slide-header">
        <div class="eyebrow">Bab 02 · Syarat & Notasi</div>
        <h2>Syarat Suatu Fungsi Memiliki Invers</h2>
      </div>
      <p class="lead">Tidak semua fungsi memiliki invers. Syarat utama: fungsi harus <strong>satu-satu (injektif)</strong>, yaitu setiap elemen pada kodomain memiliki tepat satu pre-image pada domain.</p>
      <div class="concept-grid">
        <div class="concept-card">
          <h3>Tes Garis Horizontal</h3>
          <p>Jika setiap garis horizontal memotong grafik fungsi paling banyak satu titik, maka fungsi tersebut satu-satu dan memiliki invers.</p>
        </div>
        <div class="concept-card">
          <h3>Domain & Kodomain</h3>
          <p>Domain $f^{-1}$ = Kodomain $f$<br>Kodomain $f^{-1}$ = Domain $f$</p>
        </div>
        <div class="concept-card">
          <h3>Notasi $f^{-1}(x)$</h3>
          <p>Dibaca "f invers x". <strong>Bukan</strong> berarti $\\dfrac{1}{f(x)}$. Tanda minus di sini menunjukkan invers, bukan pangkat negatif.</p>
          <div class="formula">$$f^{-1}(x) \\neq \\frac{1}{f(x)}$$</div>
        </div>
        <div class="concept-card">
          <h3>Syarat Domain</h3>
          <p>Untuk fungsi kuadrat, perlu pembatasan domain (misal $x \\geq$ nilai puncak) agar fungsi menjadi satu-satu dan inversnya berupa fungsi.</p>
        </div>
      </div>
    </section>`;
}

function buildMateri3() {

function buildExamples() {
  const ex1 = buildExample(1, 'Fungsi Linear',
    'Tentukan invers dari fungsi $f(x) = 2x + 6$',
    [
      'Misalkan $y = f(x)$, sehingga $y = 2x + 6$.',
      'Pisahkan variabel $x$: $2x = y - 6$.',
      'Bagi kedua ruas dengan 2: $x = \\dfrac{y - 6}{2} = \\dfrac{y}{2} - 3$.',
      'Ganti $y$ dengan $x$ untuk memperoleh invers: $f^{-1}(x) = \\dfrac{x - 6}{2}$.'
    ],
    '$f^{-1}(x) = \\dfrac{x - 6}{2}$');

  const ex2 = buildExample(2, 'Fungsi Rasional',
    'Tentukan invers dari $f(x) = \\dfrac{x+1}{x-2}$, $x \\neq 2$',
    [
      'Misalkan $y = \\dfrac{x+1}{x-2}$.',
      'Kalikan silang: $y(x - 2) = x + 1 \\Rightarrow xy - 2y = x + 1$.',
      'Kumpulkan suku $x$: $xy - x = 2y + 1 \\Rightarrow x(y - 1) = 2y + 1$.',
      'Bagi kedua ruas dengan $(y - 1)$: $x = \\dfrac{2y + 1}{y - 1}$.',
      'Ganti $y$ dengan $x$: $f^{-1}(x) = \\dfrac{2x + 1}{x - 1}$.'
    ],
    '$f^{-1}(x) = \\dfrac{2x + 1}{x - 1}$');

  const ex3 = buildExample(3, 'Fungsi Kuadrat',
    'Tentukan invers dari $f(x) = x^2 - 4x + 3$ untuk $x \\geq 2$',
    [
      'Lengkapkan kuadrat sempurna: $f(x) = (x^2 - 4x + 4) - 1 = (x - 2)^2 - 1$.',
      'Misalkan $y = (x - 2)^2 - 1$, maka $y + 1 = (x - 2)^2$.',
      'Akar kuadrat kedua ruas: $\\sqrt{y + 1} = x - 2$ (ambil positif karena $x \\geq 2$).',
      'Pisahkan $x$: $x = 2 + \\sqrt{y + 1}$.',
      'Ganti $y$ dengan $x$: $f^{-1}(x) = 2 + \\sqrt{x + 1}$.'
    ],
    '$f^{-1}(x) = 2 + \\sqrt{x + 1}$');

  return ex1 + ex2 + ex3;
}

// === Math particles ===
function initParticles() {
  const symbols = ['f', 'f⁻¹', 'x', 'y', '∫', '∑', '√', '∞', 'π', 'log', 'dx', 'Σ'];
  const container = document.getElementById('mathParticles');
  for (let i = 0; i < 16; i++) {
    const span = document.createElement('span');
    span.textContent = symbols[i % symbols.length];
    span.style.left = Math.random() * 100 + '%';
    span.style.fontSize = (2 + Math.random() * 4) + 'rem';
    span.style.animationDuration = (20 + Math.random() * 20) + 's';
    span.style.animationDelay = -(Math.random() * 30) + 's';
    container.appendChild(span);
  }
}

// === Navigation ===
function goToSlide(index) {
  if (index < 0 || index >= totalSlides) return;
  const slides = document.querySelectorAll('.slide');
  slides.forEach((s, i) => {
    s.classList.remove('active');
    if (i === index) s.classList.add('active');
  });
  currentSlide = index;
  updateUI();
  if (index === 29) {
    setTimeout(renderResults, 200);
  }
  // Re-typeset MathJax on the active slide
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([slides[index]]).catch(()=>{});
  }
}

function nextSlide() { goToSlide(currentSlide + 1); }
function prevSlide() { goToSlide(currentSlide - 1); }

function updateUI() {
  document.getElementById('currentSlide').textContent = String(currentSlide + 1).padStart(2, '0');
  document.getElementById('totalSlides').textContent = String(totalSlides).padStart(2, '0');
  document.getElementById('progress').style.width = ((currentSlide + 1) / totalSlides * 100) + '%';
  document.getElementById('prevBtn').disabled = currentSlide === 0;
  document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
}

// === Quiz logic ===
function selectOption(qNum, optIndex) {
  if (results[qNum]) return; // already answered
  answers[qNum] = optIndex;
  const opts = document.querySelectorAll(`.option[data-q="${qNum}"]`);
  opts.forEach((o, i) => {
    o.classList.remove('selected');
    if (i === optIndex) o.classList.add('selected');
  });
  document.getElementById(`checkBtn-${qNum}`).disabled = false;
  document.getElementById(`checkBtn-${qNum}`).classList.add('hint-pulse');
}

function checkAnswer(qNum) {
  if (results[qNum] || answers[qNum] === undefined) return;
  const q = questions[qNum - 1];
  const selected = answers[qNum];
  const isCorrect = selected === q.correct;
  results[qNum] = isCorrect ? 'correct' : 'wrong';
  
  const opts = document.querySelectorAll(`.option[data-q="${qNum}"]`);
  opts.forEach((o, i) => {
    o.classList.add('disabled');
    o.classList.remove('selected');
    if (i === q.correct) o.classList.add('correct');
    else if (i === selected) o.classList.add('wrong');
  });
  
  const status = document.getElementById(`status-${qNum}`);
  status.className = 'status-pill show ' + (isCorrect ? 'correct' : 'wrong');
  status.innerHTML = isCorrect ? '✓ Jawaban Benar' : '✗ Jawaban Salah';
  
  document.getElementById(`explanation-${qNum}`).classList.add('show');
  document.getElementById(`checkBtn-${qNum}`).disabled = true;
  document.getElementById(`checkBtn-${qNum}`).classList.remove('hint-pulse');
}

function resetQuestion(qNum) {
  if (results[qNum]) {
    delete results[qNum];
    delete answers[qNum];
    const opts = document.querySelectorAll(`.option[data-q="${qNum}"]`);
    opts.forEach(o => {
      o.classList.remove('selected', 'correct', 'wrong', 'disabled');
    });
    document.getElementById(`status-${qNum}`).className = 'status-pill';
    document.getElementById(`status-${qNum}`).innerHTML = '';
    document.getElementById(`explanation-${qNum}`).classList.remove('show');
    document.getElementById(`checkBtn-${qNum}`).disabled = true;
  } else {
    delete answers[qNum];
    const opts = document.querySelectorAll(`.option[data-q="${qNum}"]`);
    opts.forEach(o => o.classList.remove('selected'));
    document.getElementById(`checkBtn-${qNum}`).disabled = true;
  }
}

// === Results ===
function renderResults() {
  const correctCount = Object.values(results).filter(r => r === 'correct').length;
  const wrongCount = Object.values(results).filter(r => r === 'wrong').length;
  const unanswered = 20 - correctCount - wrongCount;
  const score = Math.round((correctCount / 20) * 100);
  
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('unansweredCount').textContent = unanswered;
  
  // Animate score number
  const numEl = document.getElementById('scoreNumber');
  let current = 0;
  const target = score;
  const inc = target / 60;
  const timer = setInterval(() => {
    current += inc;
    if (current >= target) { current = target; clearInterval(timer); }
    numEl.textContent = Math.round(current);
  }, 20);
  
  // Animate progress circle
  const circumference = 2 * Math.PI * 120;
  const offset = circumference - (score / 100) * circumference;
  document.getElementById('progressCircle').style.strokeDashoffset = offset;
  
  // Verdict
  let verdict;
  if (score >= 85) verdict = 'Luar biasa! Anda menguasai materi invers fungsi dengan sangat baik. 🌟';
  else if (score >= 70) verdict = 'Bagus! Pemahaman Anda sudah baik. Tingkatkan lagi untuk hasil maksimal.';
  else if (score >= 50) verdict = 'Cukup baik. Review kembali materi dan coba ulang soal yang masih salah.';
  else verdict = 'Jangan menyerah! Pelajari kembali materi dari awal dan kerjakan ulang dengan tenang.';
  document.getElementById('verdict').textContent = verdict;
  
  // Confetti if high score
  if (score >= 80) launchConfetti();
}

function launchConfetti() {
  const colors = ['#fbbf24', '#2dd4bf', '#f87171', '#4ade80', '#f59e0b'];
  const container = document.getElementById('confetti');
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (2 + Math.random() * 3) + 's';
    piece.style.animationDelay = Math.random() * 1 + 's';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
}

// === Init ===
function init() {
  const deck = document.getElementById('deck');
  deck.innerHTML = 
    buildCover() +
    buildTOC() +
    buildMateri1() +
    buildMateri2() +
    buildMateri3() +
    buildMateri4() +
    buildAplikasi() +
    buildExamples() +
    buildQuestions() +
    buildResults() +
    buildConclusion() +
    buildThanks() +
    buildSummary();
  
  initParticles();
  updateUI();
  
  // Navigation buttons
  document.getElementById('prevBtn').addEventListener('click', prevSlide);
  document.getElementById('nextBtn').addEventListener('click', nextSlide);
  
  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  });
  
  // TOC click navigation
  document.querySelectorAll('.toc-item').forEach((item, i) => {
    item.addEventListener('click', () => goToSlide(i + 2));
  });
  
  // Initial MathJax typeset
  window.addEventListener('load', () => {
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise().catch(()=>{});
    }
  });
  
  // Also try when MathJax becomes available
  const checkMJ = setInterval(() => {
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise().catch(()=>{});
      clearInterval(checkMJ);
    }
  }, 500);
  setTimeout(() => clearInterval(checkMJ), 10000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
